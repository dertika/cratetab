{% extends "admin/layout.html" %}
{% block title %}{{ ctx.t.t("admin-login-title") }} · {% endblock %}
{% block content %}
<section class="narrow">
  <h1>{{ ctx.t.t("admin-login-title") }}</h1>
  {% if let Some(e) = error %}<div class="flash flash-error" role="alert">{{ e }}</div>{% endif %}
  <form method="post" action="/admin/login" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">{{ ctx.t.t("admin-username") }}</label>
    <input type="text" id="username" name="username" value="{{ username }}" required autocomplete="username" autofocus>
    <label for="password">{{ ctx.t.t("admin-password") }}</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <div class="form-actions">
      <a href="/" class="btn btn-secondary">{{ ctx.t.t("admin-nav-kiosk") }}</a>
      <button type="submit" class="btn btn-primary">{{ ctx.t.t("admin-login-submit") }}</button>
    </div>
  </form>
</section>
{% endblock %}
